<!DOCTYPE HTML>

<html>

<head>
	<meta charset="utf-8">
	<title>Tree</title>
	<style type="text/css">
	<!--
.tree .title {}
.title span{font-weight:bold;}

.title.title1 {background-color:rgba(62, 57, 65, 1.0);color:white!important;}
.title.title2 {background-color:rgba(62, 57, 65, 0.6);color:white!important;}
.title.title3 {background-color:rgba(62, 57, 65, 0.3);color:rgba(62, 57, 65, 1.0)!important;}
.title.title4 {background-color:rgba(62, 57, 65, 0.1); color:rgba(62, 57, 65, 0.8)!important; margin: 0 10px;}

.tree ul {padding-top: 30px; position: relative;}

.tree li {float: left; text-align: center;list-style-type: none;position: relative;padding: 32px 0 0 0;}

/*We will use ::before and ::after to draw the connectors*/
.tree li::before, .tree li::after{content: '';position: absolute; top: 0; right: 50%;border-top: 3px solid #ccc;width: 50%; height: 32px;}
.tree li::after{right: auto; left: 50%;border-left: 3px solid #ccc;}

/*We need to remove left-right connectors from elements without any siblings*/
.tree li:only-child::after, .tree li:only-child::before {display: none;}

/*Remove space from the top of single children*/
.tree li:only-child{ padding-top: 0;}

/*Remove left connector from first child and right connector from last child*/
.tree li:first-child::before, .tree li:last-child::after{border: 0 none;}
/*Adding back the vertical connector to the last nodes*/
.tree li:last-child::before{border-right: 3px solid #ccc;border-radius: 0 3px 0 0;}
.tree li:first-child::after{border-radius: 3px 0 0 0;}

/*Time to add downward connectors from parents*/
.tree ul ul::before{content: '';position: absolute; top: 0; left: 50%;border-left: 3px solid #ccc;width: 0; height: 100%;}

.tree li a{border: 3px solid #6FB342;padding: 5px 10px;text-decoration: none;font-size: 0.9vw;display: inline-block;border-radius: 3px;}
	-->
	</style>
</head>

<body>
<div class="tree">
	<ul>
		<li style="position:absolute;left:0;width:100%;">
			<a class="title title1"><span>CLIENT 1</span> (Qui)</a>
			<ul>
				<li>
					<a class="title title2"><span>SITE 1</span> (Où)</a>
					<ul>
						<li>
							<a class="title title3"><span>JOB 1</span> (Quoi)</a>
						</li>
					</ul>
				</li>
				<li>
					<a class="title title2"><span>SITE 2</span> (Où)</a>
					<ul style="padding-top:100px;">
						<li>
							<a class="title title3"><span>JOB 1</span> (Quoi)</a>
						</li>
						<li>
							<a class="title title3"><span>JOB 2</span> (Quoi)</a>
							<ul>
								<li>
									<a class="title title4"><span>DEVIS 1</span> (Combien)</a>
									<ul>
										<li>
											<a class="title title4"><span>TACHE 1</span> (Quoi/Quand/Qui)</a>
										</li>
										<li>
											<a class="title title4"><span>TACHE 2</span> (Quoi/Quand/Qui)</a>
										</li>
									</ul>
								</li>
								<li>
									<a class="title title4"><span>DEVIS 2</span> (Combien)</a>
								</li>
							</ul>
						</li>
					</ul>
				</li>
				<li>
					<a class="title title2"><span>SITE 3</span> (Où)</a>
				</li>
			</ul>
		</li>
	</ul>
</div>


</body>

</html>
