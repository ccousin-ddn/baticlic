<!--
%numdoc
%datedoc
%info1
%info2
%info3
%info4
%info5

%client_name
%client_contact
%client_address
%client_vat

%about_title
%about_content
-->
<!-- Info & client -->
<div id="body">
	<div class="info">
		<div class="text-xl text-color mb-2">%numdoc%</div>
		<div class="mb-1">%datedoc%</div>
		<div class="">%info1%</div>
		<div class="">%info2%</div>
		<div class="">%info3%</div>
		<div class="">%info4%</div>
		<div class="">%info5%</div>
	</div>
	<div class="client">
		<div class="text-xl">%client_name%</div>
		<div class="text-l mb-1">%client_contact%</div>
		<div class="mb-1">%client_address%</div>
		<div>%client_vat%</div>
	</div>
</div>

<!-- About -->
<div id="about" class="mt-3 %class_about%">
	<fieldset>
		<legend class="text-color">%about_title%</legend>
		<div>%about_content%</div>
	</fieldset>
</div>

<!-- Lines -->
<div id="tables" class="mt-3">
	%tables%
	<!-- Totaux -->
	%totals%
</div>

<!-- Info PRICE -->
<div id="info-price" class="mt-2 %class_info_price%" style="page-break-inside: avoid;">
	%info_price%
</div>


<!-- Body-footer -->
<div id="body-footer" class="mt-2 %class_footer%">
	<div class="%class_footer1%">
	<fieldset style="page-break-inside: avoid;">
		<legend class="text-color">%footer1_title%</legend>
		<div>%footer1_content%</div>
	</fieldset>
	</div>
	<div class="%class_footer2%">
	<fieldset style="page-break-inside: avoid;">
		<legend class="text-color">%footer2_title%</legend>
		<div>%footer2_content%</div>
	</fieldset>
	</div>
</div>
